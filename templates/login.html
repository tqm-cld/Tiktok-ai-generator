<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<title>Anmelden – KI-Videos</title>
<style>
  :root { --bg:#0b0b12; --card:#151521; --line:#2a2a3d; --text:#f3f3f7; --muted:#9a9ab0; --pink:#ff2d6f; --err:#ff5d73; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--text);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  form { width:min(380px,100%); background:var(--card); border:1px solid var(--line); border-radius:20px; padding:26px; text-align:center; }
  img { width:64px; height:64px; border-radius:16px; }
  h1 { font-size:1.35rem; margin:12px 0 4px; }
  p { color:var(--muted); margin:0 0 18px; font-size:.95rem; }
  input { width:100%; font-size:1.6rem; letter-spacing:.1em; text-align:center; padding:12px; border-radius:14px;
          border:1px solid var(--line); background:#1d1d2c; color:var(--text); }
  button { width:100%; margin-top:14px; padding:14px; border:0; border-radius:14px; color:#fff; font:700 1.05rem system-ui,sans-serif;
           background:linear-gradient(90deg,var(--pink),#ff5f3d); }
  .err { color:var(--err); margin-top:12px; font-size:.92rem; }
</style>
</head>
<body>
<form method="post">
  <img src="/static/apple-touch-icon.png" alt="">
  <h1>Zugangscode eingeben</h1>
  <p>Den Zugangscode findest du im schwarzen Fenster auf deinem Computer – oder, wenn die App online läuft, in deinen Hugging-Face-Secrets (ACCESS_CODE).</p>
  <input name="code" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="200" autofocus required>
  <button type="submit">Anmelden</button>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
</form>
</body>
</html>
